<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polyglot Trainer</title>
<meta name="theme-color" content="#2766CC">
<meta name="description" content="Ukrainian, Russian, German, Spanish, French and Italian: a skill tree with audio, crowns and arcade games. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polyglot">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.__STANDALONE__=true;</script>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first game shell — stats strip + language chips on top, a winding lesson path as home, full-screen lessons and arcade rounds, fixed bottom tab bar. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#141C2B; --muted:#596377; --line:#D6DCE4;
  --accent:#0E7A6F; --accent-soft:#D9EFEC;
  --ok:#1D7F52; --ok-soft:#DDF1E6; --warn:#9A6A0A; --warn-soft:#F8EBCB; --bad:#C2372F; --bad-soft:#F7DEDC;
  --gold:#C98A04; --gold-soft:#FBEFCF; --flame:#E0631F;
  --uk:#2766CC; --ru:#A8323F; --de:#8C6406; --es:#B4471A; --fr:#5E45B5; --it:#4E7F14;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --nav:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#18202B; --surface-2:#1F2835; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2C3747;
  --accent:#3FC2B2; --accent-soft:#163A37;
  --ok:#5CCB93; --ok-soft:#163327; --warn:#E3B04B; --warn-soft:#3A2E12; --bad:#F07D76; --bad-soft:#3D1D1C;
  --gold:#F2C14E; --gold-soft:#3A3013; --flame:#FF8A4C;
  --uk:#6FA3F2; --ru:#E57A86; --de:#D9A73A; --es:#EE8A5C; --fr:#A893EE; --it:#9BCB5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#18202B; --surface-2:#1F2835; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2C3747;
  --accent:#3FC2B2; --accent-soft:#163A37;
  --ok:#5CCB93; --ok-soft:#163327; --warn:#E3B04B; --warn-soft:#3A2E12; --bad:#F07D76; --bad-soft:#3D1D1C;
  --gold:#F2C14E; --gold-soft:#3A3013; --flame:#FF8A4C;
  --uk:#6FA3F2; --ru:#E57A86; --de:#D9A73A; --es:#EE8A5C; --fr:#A893EE; --it:#9BCB5E; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}
svg.i{width:20px;height:20px;flex:none}
svg[fill="none"]{fill:none!important}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding-block:8px 6px}
.stat-chip{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;border:0;background:none;padding:6px 6px;border-radius:10px;min-height:40px}
.stat-chip.flame{color:var(--flame)} .stat-chip.flame.cold{color:var(--muted)}
.stat-chip svg{width:22px;height:22px}
.ring{position:relative;width:30px;height:30px}
.ring svg{width:30px;height:30px;transform:rotate(-90deg)}
.ring .bolt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.ring .bolt svg{width:14px;height:14px;transform:none}
.lvl{margin-left:auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;background:var(--surface);font-weight:700;font-size:13px;min-height:36px}
.lvl b{background:var(--lc,var(--accent));color:var(--surface);border-radius:999px;font-family:var(--f-display);font-size:12px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.langs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.langs::-webkit-scrollbar{display:none}
.lchip{--c:var(--accent);display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;white-space:nowrap;font-size:14px;font-weight:600;min-height:38px}
.lchip .code{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;background:var(--c);color:var(--surface);border-radius:999px;padding:2px 7px}
.lchip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
.nb{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.nb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{color:var(--lc,var(--accent))}
.nb .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-family:var(--f-mono);font-size:10px;border-radius:999px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
main{padding-block:16px calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}
body.focus header,body.focus nav.bottom{display:none}
body.focus main{padding-block:0}
body.focus::before{background:var(--bg)}

h2{font-family:var(--f-display);font-weight:500;font-size:21px;margin:0;text-wrap:balance;line-height:1.25}
h3{font-size:16px;font-weight:700;margin:0}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch;font-size:15px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:700;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 var(--line);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.pri{background:var(--lc,var(--accent));border-color:var(--lc,var(--accent));color:var(--surface);box-shadow:0 3px 0 color-mix(in srgb,var(--lc,var(--accent)) 60%,#000)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--surface);box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.btn.badb{background:var(--bad);border-color:var(--bad);color:var(--surface);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg,.play svg{width:18px;height:18px;fill:currentColor}
.pill{font-family:var(--f-mono);font-size:11px;border-radius:999px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mono{font-family:var(--f-mono)} .muted{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);font-size:14px}
.back{border:0;background:none;color:var(--muted);font-weight:700;padding:6px 0;display:inline-flex;align-items:center;gap:4px;min-height:40px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 10px;font-size:14px;font-weight:700;color:var(--muted);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--lc,var(--accent));border-radius:99px;transition:width .3s}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;padding:4px 0;min-height:42px}
.toggle input{width:22px;height:22px;accent-color:var(--lc,var(--accent))}
.w{font-weight:600;overflow-wrap:anywhere}
.tr{font-family:var(--f-mono);color:var(--muted)}
.en{font-weight:500}
.play{border:1px solid var(--line);background:var(--surface-2);color:var(--lc,var(--accent));width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.play.big{width:72px;height:72px;background:var(--lc);color:var(--surface);border:0;box-shadow:0 4px 0 color-mix(in srgb,var(--lc) 60%,#000)}
.play.big svg{width:30px;height:30px}
.play.big:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--lc) 60%,#000)}

/* path */
.dayhead{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.dayhead .txt{flex:1;min-width:0}
.dayhead .txt b{display:block;font-size:15px}
.dayhead .txt span{font-size:13px;color:var(--muted)}
.unit{border-radius:var(--r);padding:14px 16px;background:var(--lc);color:var(--surface);display:flex;align-items:center;gap:12px;margin-top:10px}
.unit .txt{flex:1;min-width:0}
.unit .u{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.unit b{display:block;font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.25}
.unit button{border:1.5px solid color-mix(in srgb,var(--surface) 55%,transparent);background:transparent;color:var(--surface);border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;min-height:40px}
.unit.locked{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.unit.locked button{color:var(--muted);border-color:var(--line)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 8px}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.node{width:72px;height:72px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;position:relative;background:var(--lc);color:var(--surface);box-shadow:0 6px 0 color-mix(in srgb,var(--lc) 55%,#000)}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--lc) 55%,#000)}
.node svg{width:30px;height:30px;fill:currentColor}
.node.locked{background:var(--surface-2);color:var(--muted);box-shadow:0 6px 0 var(--line);border:1px solid var(--line)}
.node.skipped{background:color-mix(in srgb,var(--lc) 45%,var(--surface-2))}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--lc);opacity:.6;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.2);opacity:0}}
.startbub{position:absolute;top:-34px;background:var(--surface);color:var(--lc);border:2px solid var(--line);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.stars{display:flex;gap:2px;height:16px}
.stars svg{width:16px;height:16px;fill:var(--line)}
.stars svg.on{fill:var(--gold)}
.trophy{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.trophy svg{width:28px;height:28px;fill:currentColor}
.trophy.won{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}


/* skill tree */
.tree{position:relative;padding:4px 0 10px}
.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.edges path{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}
.edges path.on{stroke:color-mix(in srgb,var(--lc) 55%,var(--line))}
.edges path.dash{stroke-dasharray:2 9}
.secname{position:relative;z-index:1;display:flex;align-items:baseline;gap:8px;justify-content:center;font-family:var(--f-display);font-weight:500;font-size:15px;margin:18px 0 6px;color:var(--ink)}
.secname span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lc)}
.secname.locked,.secname.locked span{color:var(--muted)}
.trow{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:14px 0}
.skn{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.skc{position:relative;width:92px;height:92px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.skc .pring{position:absolute;inset:0}
.skc .pring svg{width:92px;height:92px;transform:rotate(-90deg)}
.skc .disc{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--lc);color:var(--surface);box-shadow:0 5px 0 color-mix(in srgb,var(--lc) 55%,#000);position:relative}
.skc:active .disc{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--lc) 55%,#000)}
.skc .disc svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.skc.open .disc{background:var(--surface);color:var(--lc);border:3px solid var(--lc);box-shadow:0 5px 0 color-mix(in srgb,var(--lc) 40%,var(--line))}
.skc.locked .disc{background:var(--surface-2);color:var(--muted);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.skc.locked .pring{opacity:.0}
.skc.gold .disc{background:var(--gold);box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.skc.weak .disc{background:color-mix(in srgb,var(--lc) 45%,var(--surface-2))}
.skc .crack{position:absolute;inset:11px;border-radius:50%;pointer-events:none;background:linear-gradient(118deg,transparent 46%,var(--surface) 47%,var(--surface) 49%,transparent 50%),linear-gradient(62deg,transparent 58%,var(--surface) 59%,var(--surface) 60.5%,transparent 61.5%);opacity:.85}
.crownb{position:absolute;right:2px;bottom:2px;display:flex;align-items:center;gap:1px;background:var(--surface);border:2px solid var(--gold);color:var(--gold);border-radius:999px;font-weight:800;font-size:12px;padding:0 6px 0 4px;line-height:20px;font-family:var(--f-display)}
.crownb svg{width:13px;height:13px;fill:currentColor}
.crownb.zero{border-color:var(--line);color:var(--muted)}
.skname{font-size:13px;font-weight:700;line-height:1.2;max-width:110px;text-wrap:balance}
.skn.bon .skc .disc{outline:2px dashed var(--muted);outline-offset:5px}
.bonus{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--muted);border-radius:99px;padding:0 6px}
.sbar{display:flex;gap:2px}
.sbar i{width:9px;height:5px;border-radius:2px;background:var(--line)}
.sbar i.on{background:var(--gold)}
.cpc{width:76px;height:76px;border-radius:22px;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--line)}
.cpc svg{width:38px;height:38px;fill:currentColor}
.cpc.ok{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.cpc.fin{border-radius:50%}
.legendrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:12px;color:var(--muted)}
.legendrow i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lg-open{background:var(--lc)} .lg-weak{background:color-mix(in srgb,var(--lc) 45%,var(--surface-2))} .lg-gold{background:var(--gold)} .lg-opt{border:1.5px dashed var(--muted)}
.sheeticon{width:60px;height:60px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--lc);color:var(--surface)}
.sheeticon svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheeticon.gold{background:var(--gold)} .sheeticon.locked{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.sheeticon.cp svg{fill:currentColor;stroke:none}
.crowns{display:flex;gap:2px}
.crowns svg{width:18px;height:18px;fill:var(--line)}
.crowns svg.on{fill:var(--gold)}
.crownchip{color:var(--gold)}
.crownchip svg{width:22px;height:22px;fill:currentColor}
.bigcrown{position:relative;width:110px;height:110px;color:var(--lc);animation:starin .5s backwards}
.bigcrown svg{width:110px;height:110px;fill:currentColor}
.bigcrown.gold{color:var(--gold)}
.bigcrown b{position:absolute;left:0;right:0;top:52px;text-align:center;font-family:var(--f-display);font-size:24px;color:var(--surface)}
@media (max-width:370px){.skc{width:80px;height:80px}.skc .pring svg{width:80px;height:80px}.skc .disc{width:60px;height:60px}.skname{font-size:12px}}


/* typing + keyboard */
.kb{display:flex;flex-direction:column;gap:6px;padding:6px 0 2px;user-select:none;-webkit-user-select:none}
.kb .r{display:flex;gap:4px;justify-content:center}
.kb .k{flex:1 1 0;max-width:42px;min-width:0;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:18px;font-weight:600;padding:0;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.kb .k:active{transform:translateY(2px);box-shadow:none;background:var(--surface-2)}
.kb .k.wide{max-width:none;flex:4 1 0;font-size:14px;color:var(--muted)}
.kb .k.wide2{max-width:none;flex:1.6 1 0;font-size:16px}
.kb .k.ent{background:var(--ok);border-color:var(--ok);color:var(--surface);font-size:14px}
.kb .k.hit{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.kb .k.near{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.kb .k.miss{background:var(--surface-2);color:var(--muted);opacity:.55}
.tbox{min-height:58px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;font-size:24px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.tbox.small{min-height:48px;font-size:20px;padding:8px 12px}
.tbox.ok{border-color:var(--ok);background:var(--ok-soft)} .tbox.bad{border-color:var(--bad);background:var(--bad-soft)}
.tbox .caret{display:inline-block;width:2px;height:1.1em;background:var(--lc);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tin{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;font-size:22px;font-weight:600}

/* games */

.ghost{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;margin:0}

.bossbox{display:flex;flex-direction:column;align-items:center;gap:4px}

.slgrid{display:flex;flex-direction:column;gap:6px;width:100%;margin:0 auto}

.sq{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;text-transform:uppercase;background:var(--surface)}

.flipgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fc{min-height:78px;border:2px solid var(--line);border-radius:14px;background:var(--lc);color:var(--surface);font-weight:700;font-size:15px;padding:6px;box-shadow:0 3px 0 color-mix(in srgb,var(--lc) 55%,#000);overflow-wrap:anywhere}
.fc .q{font-family:var(--f-display);font-size:26px;opacity:.7}
.fc.up{background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line)}

.gallows{width:120px;height:120px;margin:0 auto;color:var(--ink)}
.hword{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:26px;font-weight:800;font-family:var(--f-mono)}

.wgrid{display:grid;gap:3px;width:100%;max-width:420px;margin:0 auto}
.wc{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:700;font-size:16px;padding:0;text-transform:uppercase}

.clues{display:flex;flex-wrap:wrap;gap:6px}

/* street talk */
.stc{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));max-height:85vh;overflow-y:auto;animation:up .2s ease-out}

/* lesson */
.lsn{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

.lprog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums}
.hearts svg{width:22px;height:22px;fill:currentColor}
.combo{display:flex;align-items:center;gap:3px;font-weight:800;color:var(--flame);font-size:14px;min-width:0}

@keyframes pop{40%{transform:scale(1.35)}}
.lbody{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:6px 150px}
.prompt{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.3;text-wrap:balance}
.bigword{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 0}

.bigword .tr{font-size:17px}
.bigword .en{font-size:20px}
.newtag{align-self:center;background:var(--gold-soft);color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid var(--gold)}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;min-height:56px;display:flex;flex-direction:column;justify-content:center;font-weight:600;font-size:17px;box-shadow:0 3px 0 var(--line)}

.opt .tr{font-size:12px;font-weight:400}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}

.opt.dim{opacity:.5}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.slots{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}

.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;font-size:18px;min-height:48px;min-width:44px;box-shadow:0 3px 0 var(--line)}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px}
.pt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;min-height:58px;font-weight:600;font-size:16px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2}

.pt.sel{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,var(--surface));box-shadow:0 3px 0 var(--lc)}
.pt.done{opacity:.25;pointer-events:none;box-shadow:none}
.pt.wrong{border-color:var(--bad);animation:shake .35s}
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
.fbar .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* results */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding-block:30px 160px}

.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.rstat{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.rstat span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px;color:var(--surface)}

.rstat.xp{border-color:var(--gold)} .rstat.xp span{background:var(--gold)}
.rstat.acc{border-color:var(--ok)} .rstat.acc span{background:var(--ok)}

/* overlay award */
.award{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;background:rgba(10,14,22,.5);padding:24px}

/* game */
.ghead{display:flex;align-items:center;gap:10px;padding-block:12px}
.score{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.tbar{flex:1;height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}

.float{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--ok);pointer-events:none;z-index:30;animation:floatup .7s ease-out forwards}

/* me */
.profile{display:flex;gap:16px;align-items:center}
.lvring{position:relative;width:96px;height:96px;flex:none}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wd i{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--surface-2);border:1px solid var(--line);min-height:4px}
.wd i.hit{background:var(--gold);border-color:var(--gold)}

.mstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ms{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);display:flex;gap:10px;align-items:center}
.ms svg{width:24px;height:24px;flex:none}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}

.bdg b{font-size:12px;line-height:1.2}
.bdg span{font-size:10.5px;color:var(--muted);line-height:1.25}
.langrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:14px}

/* reused bits */
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lc);border-radius:var(--r);padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:min(56vh,420px)}

.wrow .ic{color:var(--lc);flex:none;display:flex}.wrow .ic svg{width:20px;height:20px;fill:currentColor}

.c-same{--k:var(--ok)} .c-false{--k:var(--bad)} .c-new{--k:var(--uk)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.lt{position:relative;border:1px solid var(--line);border-bottom:3px solid var(--k);background:var(--surface);border-radius:12px;padding:8px 2px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:84px}
.lt b{font-size:24px;font-weight:600;line-height:1.1}
.lt .t{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lt .x{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:3px}
.lt .m{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.lt .m.on{background:var(--ok)}
.lt.playing{outline:2px solid var(--lc);outline-offset:-1px}
.glyphbig{font-size:68px;font-weight:600;line-height:1;text-align:center}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qopts .opt{font-family:var(--f-mono);align-items:center;text-align:center}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;font-size:16px}
textarea{resize:vertical;min-height:84px}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.cmp td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp td small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tbl{overflow-x:auto}
.ukc{color:var(--uk)} .ruc{color:var(--ru)}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairgrid .panel{border-top:4px solid var(--c);padding:12px}
.glyphs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.glyph{text-align:center;min-width:44px}
.glyph b{display:block;font-size:28px;font-weight:600;line-height:1.1}
.glyph span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.which{font-size:clamp(26px,8vw,38px);font-weight:600;text-align:center;padding:8px 0}
.ff{display:grid;gap:8px}
.ffrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ffcell{background:var(--surface-2);border-radius:12px;padding:10px;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.ffcell b{font-size:18px}
.dcard{text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.dcard p{margin:0;font-size:14px;color:var(--muted)}
.exgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.exgroup h4{margin:0 0 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.exrow{display:flex;gap:10px;align-items:center;padding:6px 0;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.exgroup h4+.exrow{border-top:0}
.exrow .txt{flex:1;min-width:0} .exrow .t{font-weight:600;font-size:17px} .exrow .e{color:var(--muted);font-size:14px}
.exrow .ic{color:var(--lc);display:flex}.exrow .ic svg{width:18px;height:18px;fill:currentColor}
.q{font-size:17px;font-weight:600;border-left:3px solid var(--lc);padding-left:12px}
.hint{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:15px}
.rule{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.tutorfb{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
.chat{display:flex;flex-direction:column;gap:10px;min-height:240px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.a{background:var(--surface-2);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.msg.u{background:var(--lc);color:var(--surface);border-top-right-radius:4px;align-self:flex-end}
.msg.a em{color:var(--muted)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;height:48px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;white-space:nowrap;min-height:40px}
.chips button[aria-pressed="true"]{border-color:var(--lc);box-shadow:inset 0 0 0 1px var(--lc)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

@media (min-width:600px){ .opts{grid-template-columns:1fr 1fr} .topics{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:370px){ .qopts{grid-template-columns:1fr} .pairgrid,.ffrow{grid-template-columns:1fr} .stat-chip{font-size:14px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

{id:"uk-have",lang:"uk",title:"How to say “I have”",teaser:"Ukrainian rarely uses a verb for ‘have’. What does it do instead?",

function translit(text,lang){
  const map=lang==="uk"?TR_UK:TR_RU; let out=""; const s=text.normalize("NFC");
  for(let i=0;i<s.length;i++){
    const ch=s[i], lo=ch.toLowerCase(), prev=(s[i-1]||" ").toLowerCase(), next=(s[i+1]||"").toLowerCase();
    if(!(lo in map)){out+=ch;continue}
    let r=map[lo];
    if(lang==="ru"&&lo==="е"&&(!/[а-яё]/.test(prev)||VOW.includes(prev)||prev==="ь"||prev==="ъ"))r="ye";
    if(lang==="uk"&&lo==="й"&&prev==="и")r="i";
    if(lang==="ru"&&lo==="й"&&prev==="ы")r="";
    if(lang==="ru"&&lo==="и"&&next==="й")r="i";
    if(ch!==lo&&r)r=r[0].toUpperCase()+r.slice(1);
    out+=r;
  }
  return out;
}

async function exportCode(){
  const json=JSON.stringify(Object.assign({},S,{tab:"learn"}));

  try{if(window.CompressionStream){const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));bytes=new Uint8Array(await new Response(st).arrayBuffer());pre="PT1z."}}catch(e){}
  let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));

}

  if(!z&&!p)throw new Error("That doesn't look like a progress code. It should start with PT1.");
  const bin=atob(code.slice(z?5:4).replace(/\s/g,""));let u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);

}

const AUD={}, LOADING={}, URLS={};
const player=new Audio(); player.preload="auto";
function loadAudio(lang){
  if(AUD[lang])return Promise.resolve(AUD[lang]);
  if(LOADING[lang])return LOADING[lang];
  LOADING[lang]=fetch("audio-"+lang+".json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{AUD[lang]=j;return j}).catch(()=>{LOADING[lang]=null;return null});
  return LOADING[lang];
}
function clipURL(lang,key){
  const id=lang+"|"+key; if(URLS[id])return URLS[id];
  const b=AUD[lang]&&AUD[lang][key]; if(!b)return null;
  const bin=atob(b), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return URLS[id]=URL.createObjectURL(new Blob([u8],{type:"audio/mpeg"}));
}

  try{const ss=window.speechSynthesis;if(!ss)return false;const u=new SpeechSynthesisUtterance(text.replace(/…/g,""));u.lang=lang==="en"?"en-GB":LANGS[lang].tts;u.rate=.85;if(onend)u.onend=onend;ss.cancel();ss.speak(u);return true}catch(e){return false}
}
function play(lang,key,opts={}){
  if(!opts.keepListen)stopListen();
  const url=clipURL(lang,key);
  player.onended=null;
  if(url){player.onended=opts.onend||null;player.src=url;const p=player.play();if(p&&p.catch)p.catch(()=>{if(opts.onend)setTimeout(opts.onend,400)});return true}
  if(!AUD[lang]){loadAudio(lang);if(!opts.quiet)toast("Audio is still loading. Try again in a moment.");return false}
  if(opts.text&&speakFallback(opts.text,lang,opts.onend))return true;
  return false;
}

  const now=Date.now();

  if(g===1){st.lapses++;st.reps=0;st.ivl=0;st.ease=Math.max(1.3,st.ease-.2);st.due=now+MIN;return st}

function sk(lang,cat){return (S.skills[lang]&&S.skills[lang][cat])||{c:0,s:0}}
function setSk(lang,cat,v){if(!S.skills[lang])S.skills[lang]={};S.skills[lang][cat]=v}
const crowns=(lang,cat)=>sk(lang,cat).c;
function cpPassed(lang,i){return !!(S.cps[lang]&&S.cps[lang][i])||SECTIONS[i].req.every(c=>crowns(lang,c)>=1)}
function preOk(lang,p){return p.startsWith("CP")?cpPassed(lang,+p.slice(2)-1):crowns(lang,p)>=1||!!sk(lang,p).ready}
function unlocked(lang,cat){const s=SEC[cat];if(s>0&&!cpPassed(lang,s-1))return false;return (PRE[cat]||[]).every(p=>preOk(lang,p))}
function skillWords(cat){return CONCEPTS.filter(c=>c.cat===cat)}
function strength(lang,cat){const seen=skillWords(cat).filter(c=>S.cards[key(lang,c.id)]);if(!seen.length)return 1;const now=Date.now();return 1-seen.filter(c=>S.cards[key(lang,c.id)].due<=now).length/seen.length}
function weak(lang,cat){return crowns(lang,cat)>=1&&strength(lang,cat)<.75}
function totalCrowns(lang){return CATS.reduce((s,c)=>s+crowns(lang,c),0)}
function migrateSkills(){
  for(const l of ORDER)for(const cat of CATS){
    if(S.skills[l]&&S.skills[l][cat])continue;
    const ls=SKILL_LESSONS[cat];let n=0;while(n<ls.length&&lessonRec(l,ls[n].id))n++;
    let v=n>=ls.length?{c:1,s:0}:{c:0,s:n};
    if(v.c===0&&skillWords(cat).every(c=>status(l,c.id)==="known"))v={c:1,s:0};
    if(n>0||v.c>0)setSk(l,cat,v);
  }
}
function treeOrder(){return SECTIONS.flatMap(s=>s.rows.flat().filter(c=>c&&c!=="Street talk"))}
function nextSkill(lang){
  const open=treeOrder().filter(c=>unlocked(lang,c));
  return open.find(c=>crowns(lang,c)===0&&sk(lang,c).s>0)||open.find(c=>crowns(lang,c)===0&&!OPTIONAL.has(c))||open.find(c=>crowns(lang,c)===0)||open.slice().sort((a,b)=>crowns(lang,a)-crowns(lang,b))[0];
}

function strengthBar(p){const n=Math.round(p*4);return `<span class="sbar" title="Strength ${Math.round(p*100)}%">${[0,1,2,3].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</span>`}

  const prog=gold?1:(v.c===0?introducedFrac(lang,cat):Math.min(1,(v.s||0)/lessonsPerLevel(cat)))*.5+stageFrac(lang,cat,NEED[Math.min(MAXC,v.c+1)])*.5;
  const cls=!open?"locked":gold?"gold":wk?"weak":v.c>0?"has":"open";
  return `<div class="skn ${opt?"bon":""}"><button class="skc ${cls}" data-sk="${esc(cat)}" data-hub="sk:${esc(cat)}" aria-label="${esc(cat)}, level ${v.c}${open?"":", locked"}">

  const gn=$("#goNext");if(gn)gn.onclick=()=>{const c=nextSkill(lang);if(c)skillSheet(c)};
  const st=$("#strengthen");if(st)st.onclick=()=>startSession("practice",null);
  requestAnimationFrame(drawEdges);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(drawEdges));

function drawEdges(){
  const box=$("#tree"),svg=$("#edges");if(!box||!svg)return;
  const r0=box.getBoundingClientRect(),lang=S.lang;
  svg.setAttribute("viewBox",`0 0 ${r0.width} ${r0.height}`);svg.setAttribute("width",r0.width);svg.setAttribute("height",r0.height);
  const hub=id=>{const el=box.querySelector(`[data-hub="${CSS.escape(id)}"]`);if(!el)return null;const r=el.getBoundingClientRect();return{x:r.left-r0.left+r.width/2,top:r.top-r0.top,bot:r.bottom-r0.top}};
  const E=[];
  for(const [cat,ps] of Object.entries(PRE))for(const p of ps){const from=p.startsWith("CP")?"cp:"+p.slice(2):"sk:"+p;E.push([from,"sk:"+cat,preOk(lang,p),OPTIONAL.has(cat)])}
  SECTIONS.forEach((s,si)=>{const to=si<SECTIONS.length-1?"cp:"+(si+1):"fin";for(const c of s.leaves)E.push(["sk:"+c,to,crowns(lang,c)>=1,false])});

    return `<path d="M${A.x} ${y1}C${A.x} ${my} ${B.x} ${my} ${B.x} ${y2}" class="${ok?"on":""} ${opt?"dash":""}"/>`}).join("");

/* ================= Word stages ================= */
// Stage 0 = never seen · 1 = met · 2 = recognised on a later day · 3+ = produced (typed/built) on later days · 5 = mastered
function migrStage(s){return s.reps>=2?3:s.reps>=1?2:1}
function stg(lang,id){const s=S.cards[key(lang,id)];return !s?0:(s.stg??migrStage(s))}
function bumpStage(lang,c,ok,prod){
  const k=key(lang,c.id);let st=S.cards[k];if(!st)return;
  if(st.stg==null)st.stg=migrStage(st);
  const t=today();let s=st.stg;
  if(ok){if(s===0){s=1;st.up=t}else if(st.up!==t){const cap=prod?5:2;if(s<cap){s++;st.up=t}}}
  else if(st.down!==t&&s>1){s--;st.down=t}
  st.stg=s;
}
// apply one session result to a word: spaced-repetition schedule plus stage
function recordWord(lang,c,ok,prod){
  const k=key(lang,c.id),isNew=!S.cards[k];if(isNew)bumpNew(lang);
  S.cards[k]=nextState(S.cards[k],ok?3:1);if(isNew)S.cards[k].stg=0;bumpStage(lang,c,ok,prod);
}
const NEED=[0,2,3,3,4,4];

  let p=shuffle(pool.filter(ok));if(p.length<n)p=p.concat(shuffle(CONCEPTS.filter(x=>ok(x)&&!p.includes(x))));

const tokensOf=t=>strip(t).replace(/[¿¡?!.,…]/g," ").split(/\s+/).filter(Boolean);

function buildTiles(c,lang){

    const low=toks.map(w=>w.toLowerCase());let dec=[];

    for(const w of others){if(dec.length>=3)break;if(!low.includes(w.toLowerCase())&&!dec.map(d=>d.toLowerCase()).includes(w.toLowerCase()))dec.push(w)}

function planLesson(lang,cat,level){

  const due=dueCount(lang);

  nNew=Math.min(nNew,Math.max(0,S.newPerDay-newCountToday(lang)),fresh.length);
  if(level===0&&!met.length&&fresh.length)nNew=Math.min(3,fresh.length);
  const newW=fresh.slice(0,nNew);
  const rev=met.sort((a,b)=>wordScore(lang,a)-wordScore(lang,b)).slice(0,Math.max(3,(level>0?7:6)-newW.length));
  const others=CONCEPTS.filter(c=>c.cat!==cat&&S.cards[key(lang,c.id)]&&S.cards[key(lang,c.id)].due<=Date.now()).sort((a,b)=>wordScore(lang,a)-wordScore(lang,b)).slice(0,2);

function buildQueue(newW,rev,lang,shift){
  const all=newW.concat(rev),ex=[];
  const first=[];newW.forEach(c=>first.push([{t:"intro",c},exFor(c,lang,all,0)]));
  rev.forEach(c=>first.push([exFor(c,lang,all,stg(lang,c.id)+shift)]));
  // interleave new words between reviews so it never feels like a block of new stuff
  const order=[];const nw=first.slice(0,newW.length),rv=shuffle(first.slice(newW.length));
  while(nw.length||rv.length){if(rv.length)order.push(rv.shift());if(nw.length)order.push(nw.shift())}

function answer(ok,info,silentSfx){
  const e=LS.q[LS.i];
  LS.answered=Object.assign({ok,praise:rnd(PRAISE)},info);
  if(e.t==="match")e.ws.forEach(c=>noteWord(c,true,false));
  else noteWord(e.c,ok,PROD.has(e.t)&&ok&&(info.q==="full"||info.q==="typo"));
  if(ok){
    LS.correct++;LS.combo++;LS.maxCombo=Math.max(LS.maxCombo,LS.combo);
    const g=(PROD.has(e.t)?3:2)+(LS.combo>=10?2:LS.combo>=5?1:0);LS.xp+=g;
    if(LS.combo>=5&&LS.combo%5===0){sfx("combo");LS.answered.praise=`${LS.combo} in a row!`}else if(!silentSfx)sfx("ok");
    buzz(15);
  } else {
    LS.mistakes++;LS.combo=0;LS.hearts--;if(e.c)LS.wrong.add(e.c.id);
    if(!LS.test&&e.t!=="intro")LS.q.push(e.t==="match"?mkMatch(e.ws):mkEx(e.t,e.c,LS.lang,LS.pool));
    sfx("bad");buzz([40,40,40]);
  }
  render();
}
function nextEx(){
  if(LS.hearts<=0){LS.phase="fail";render();return}
  LS.i++;LS.answered=null;
  if(LS.i>=LS.q.length){finishLesson();return}
  render();window.scrollTo(0,0);exEnter();
}
function quitLesson(){
  openSheet(`<h2>Quit this ${LS.test?"test":"lesson"}?</h2><p class="lede" style="margin:0">You'll lose the XP from this ${LS.test?"test":"lesson"} so far.</p><button class="btn pri block" id="keep">Keep going</button><button class="btn ghost block" id="q" style="color:var(--bad)">Quit</button>`,sh=>{
    sh.querySelector("#keep").onclick=closeSheet;
    sh.querySelector("#q").onclick=()=>{closeSheet();LS=null;stopListen();render();window.scrollTo(0,0)};
  });
}
function finishLesson(){
  const lang=LS.lang,k=LS.kind,perfect=LS.mistakes===0;
  let bonus=10+(perfect?5:0);
  // words: every word that appeared, with its worst result
  for(const e of LS.q){if(e.t==="intro")noteWord(e.c,true,false)}
  const before={};for(const r of Object.values(LS.res))before[r.c.id]=stg(lang,r.c.id);
  if(k!=="cptest"&&k!=="crowntest")for(const r of Object.values(LS.res))recordWord(lang,r.c,!r.wrong,r.prod);
  LS.stageUps=Object.values(LS.res).filter(r=>stg(lang,r.c.id)>before[r.c.id]).length;
  if(k==="lesson"){
    const v=Object.assign({},sk(lang,LS.cat));LS.before=v.c;
    if(v.c===0)v.ready=introducedFrac(lang,LS.cat)>=1;
    else{v.s=Math.min(lessonsPerLevel(LS.cat),(v.s||0)+1);if(v.s>=lessonsPerLevel(LS.cat))v.ready=true}
    setSk(lang,LS.cat,v);
    S.stats.lessons++;if(perfect)S.stats.perfect++;S.stats.langs[lang]=true;
    const h=new Date().getHours();if(h>=22)S.stats.night=true;if(h<8)S.stats.early=true;
  } else if(k==="crowntest"){
    const v=sk(lang,LS.cat),nc=Math.min(MAXC,v.c+1),n=NEED[nc];
    for(const c of skillWords(LS.cat)){const kk=key(lang,c.id);let st=S.cards[kk];if(!st){bumpNew(lang);st={ivl:3,ease:2.5,reps:2,lapses:0,due:Date.now()+3*DAY}}st.stg=Math.max(st.stg??migrStage(st),n);S.cards[kk]=st}
    setSk(lang,LS.cat,{c:nc,s:0,ready:false});LS.levelUp=nc;S.stats.testOut++;bonus=20;
  } else if(k==="cptest"){if(!S.cps[lang])S.cps[lang]={};S.cps[lang][LS.sec]=true;S.stats.testOut++;S.stats.cps=(S.stats.cps||0)+1;bonus=30}
  else bonus=5+(perfect?5:0);
  // claim any crowns whose words have now settled
  for(const cat of CATS){const got=tryClaim(lang,cat);if(got){if(cat===LS.cat&&k==="lesson")LS.levelUp=got;else AWARDQ.push({kind:"crown",cat,n:got});bonus+=10*got}}
  if(k==="lesson")LS.after=sk(lang,LS.cat);
  S.stats.maxCombo=Math.max(S.stats.maxCombo,LS.maxCombo);
  LS.total=LS.xp+bonus;LS.phase="result";LS.acc=Math.round(LS.correct/Math.max(1,LS.correct+LS.mistakes)*100);
  addXP(LS.total);
  render();sfx("win");confetti();buzz([30,50,30,50,60]);
}
function crownStatus(lang,cat){
  const v=sk(lang,cat);if(v.c>=MAXC)return"";
  const n=NEED[v.c+1],ws=skillWords(cat),settled=ws.filter(c=>stg(lang,c.id)>=n).length,needN=Math.ceil(ws.length*.8);
  if(v.c===0&&!v.ready){const met=ws.filter(c=>S.cards[key(lang,c.id)]).length;return `${met} of ${ws.length} words met. Meet them all, then let them settle.`}
  if(!v.ready)return `Lesson ${(v.s||0)+1} of ${lessonsPerLevel(cat)} toward level ${v.c+1}.`;
  return `Lessons done. ${settled} of ${needN} words have settled (stage ${n}). Practise on another day to claim the crown.`;
}

  const k=LS.kind,secs=Math.round((Date.now()-LS.start)/1000);

  else top=`<div class="bigcrown">${ICON.heart.replace("<svg",'<svg style="fill:var(--bad)"')}</div><h2>${k==="street"?"Street smart":"Words refreshed"}</h2><p class="lede" style="margin:0">${esc(LS.title)} done.</p>`;
  m.innerHTML=`<div class="lsn" style="--lc:${lc(LS.lang)}"><div class="result">${top}
    <div class="rstats"><div class="rstat xp"><span>Total XP</span><b id="xpc">0</b></div><div class="rstat acc"><span>Accuracy</span><b>${LS.acc}%</b></div><div class="rstat cmb"><span>Words up</span><b>${LS.stageUps||0}</b></div></div>
    <p class="muted" style="font-size:13px;margin:0">${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")} · ${LS.correct} correct · ${LS.mistakes} mistake${LS.mistakes===1?"":"s"} · best combo ${LS.maxCombo}</p>
    ${LS.stageUps?`<p class="muted" style="font-size:13px;margin:0">${LS.stageUps} word${LS.stageUps>1?"s":""} moved up a stage. Each word can move up once a day, so coming back tomorrow is what makes them stick.</p>`:""}

  const el=$("#xpc"),target=LS.total;let v=0;const step=()=>{v=Math.min(target,v+Math.max(1,Math.ceil(target/25)));el.textContent="+"+v;if(v<target)requestAnimationFrame(step)};step();
  $("#cont").onclick=()=>{const back=LS.kind==="street";LS=null;if(back){S.tab="practice";P={mode:"street"}}render();window.scrollTo(0,0)};

/* review */
let cur=null, revealed=false, revCombo=0;
function pickCard(){const q=queue(S.lang);cur=q.due[0]||q.fresh[0]||null;revealed=false}
function grade(g){
  if(!cur)return;
  const k=key(S.lang,cur.id), isNew=!S.cards[k];
  S.cards[k]=nextState(S.cards[k],g);
  if(isNew){bumpNew(S.lang);S.cards[k].stg=0}
  bumpStage(S.lang,cur,g>=2,S.dir==="prod"&&g>=3);
  if(g>=3){revCombo++;sfx(revCombo%10===0?"combo":"ok");floatText("+2 XP");addXP(2)}else if(g===2){revCombo++;addXP(1);floatText("+1 XP")}else{revCombo=0;sfx("bad")}
  S.stats.maxCombo=Math.max(S.stats.maxCombo,revCombo);
  save();pickCard();render();
  if(cur&&S.autoplay&&S.dir==="recog")playWord(cur,S.lang);
}
function vReview(m){
  if(!cur||!CONCEPTS.includes(cur))pickCard();
  const q=queue(S.lang), lang=S.lang, l=L();
  let card;
  if(!cur){card=`<div class="card done"><div class="medal">${ICON.check}</div><h2>All caught up</h2><p class="lede" style="text-align:center;margin-bottom:8px">Nothing due. Take the next lesson on the path to learn new words.</p><button class="btn pri" data-tab="learn">Go to the path</button></div>`}
  else{
    const st=S.cards[key(lang,cur.id)], isNew=!st, tgt=cur[lang];
    const front=S.dir==="recog"?`<span class="w" lang="${lang}">${esc(wt(cur,lang))}</span>${tgt.tr&&S.showTr?`<span class="tr">${esc(tgt.tr)}</span>`:""}`:`<span class="en" style="font-size:26px">${esc(cur.en)}</span><span class="muted">Say it in ${esc(l.name)}, then reveal.</span>`;
    const back=S.dir==="recog"?`<div class="divider"></div><span class="en">${esc(cur.en)}</span>${tgt.tr&&!S.showTr?`<span class="tr">${esc(tgt.tr)}</span>`:""}`:`<div class="divider"></div><span class="w" lang="${lang}">${esc(wt(cur,lang))}</span>${tgt.tr?`<span class="tr">${esc(tgt.tr)}</span>`:""}`;
    const prev=g=>fmt(nextState(st,g).due-Date.now());
    card=`<div class="card"><div class="meta"><span class="pill">${esc(cur.cat)}</span>${revCombo>=3?`<span class="combo">${ICON.flame}${revCombo}</span>`:`<span class="pill">${isNew?"new":`${q.due.length} left`}</span>`}</div>
      <div class="face">${front}${revealed?back:""}</div>
      <div class="row" style="justify-content:center"><button class="play big" id="say" aria-label="Play">${ICON.play}</button></div>
      ${revealed?`<div class="grades"><button class="grade g1" data-g="1">Again<small>${prev(1)}</small></button><button class="grade g2" data-g="2">Hard<small>${prev(2)}</small></button><button class="grade g3" data-g="3">Good<small>${prev(3)}</small></button><button class="grade g4" data-g="4">Easy<small>${prev(4)}</small></button></div>`:`<button class="btn pri block" id="reveal" style="min-height:54px">Show answer</button>`}</div>`;
  }
  m.innerHTML=`<div class="stack">${backBtn("Practice")}<div><span class="eyebrow">${esc(l.name)}</span><h2>Daily review</h2></div>
    <div class="seg" role="group"><button data-dir="recog" aria-pressed="${S.dir==="recog"}">${esc(l.name)} → English</button><button data-dir="prod" aria-pressed="${S.dir==="prod"}">English → ${esc(l.name)}</button></div>${card}</div>`;
  bindBack();

/* listen */
const LPs={on:false,step:0,timer:null,engFirst:false};
function stopListen(){if(LPs.on){LPs.on=false;clearTimeout(LPs.timer);try{player.pause()}catch(e){}updateListenUI()}}
function startListen(){
  if(!P.list||!P.list.length)return;
  if(!AUD[S.lang]||!AUD.en){Promise.all([loadAudio(S.lang),loadAudio("en")]).then(()=>{if(P.mode==="listen")toast("Audio loaded. Tap play.")});toast("Loading audio…");return}
  LPs.on=true;LPs.step=0;clearTimeout(LPs.timer);updateListenUI();lpRun();
}
function lpSeq(c){const t=[S.lang,c.id],e=["en",c.id];return LPs.engFirst?[e,["g",700],t,["g",1100],t,["g",1700]]:[t,["g",900],e,["g",900],t,["g",1700]]}
function lpRun(){
  if(!LPs.on||S.tab!=="practice"||P.mode!=="listen")return;
  const list=P.list;let c=list[P.i%list.length],seq=lpSeq(c);
  if(LPs.step>=seq.length){LPs.step=0;P.i=(P.i+1)%list.length;c=list[P.i];seq=lpSeq(c);updateListenUI()}
  const s=seq[LPs.step++];
  if(s[0]==="g"){LPs.timer=setTimeout(lpRun,s[1]);return}
  const lang=s[0],cc=BYID[s[1]];
  if(!play(lang,cc.id,{keepListen:true,quiet:true,text:lang==="en"?cc.en:cc[lang].t,onend:()=>{LPs.timer=setTimeout(lpRun,60)}}))LPs.timer=setTimeout(lpRun,800);
}
function updateListenUI(){
  if(S.tab!=="practice"||P.mode!=="listen")return;
  const c=P.list[P.i%P.list.length],box=$("#lpcard");if(box)box.innerHTML=wordBlock(c,S.lang);
  const pb=$("#lpplay");if(pb){pb.innerHTML=LPs.on?ICON.pause:ICON.play;pb.setAttribute("aria-label",LPs.on?"Pause":"Play")}
  const ct=$("#lpcount");if(ct)ct.textContent=(P.i%P.list.length+1)+" / "+P.list.length;
}
function vListen(m){
  m.innerHTML=`<div class="stack">${backBtn(P.back==="topic"?P.cat:"Practice")}<div><h2>Listen: ${esc(P.title)}</h2><p class="lede">${esc(L().name)}, then English, then ${esc(L().name)} again. Say it out loud in the gap.</p></div>
    <div class="lplayer"><span class="pill" id="lpcount"></span><div class="face" id="lpcard" style="min-height:150px"></div>
    <div class="ctrls"><button class="play sm" id="lpprev" aria-label="Previous">${ICON.prev}</button><button class="play big" id="lpplay"></button><button class="play sm" id="lpnext" aria-label="Next">${ICON.next}</button></div></div>
    <div class="panel"><label class="toggle"><span>English first</span><input type="checkbox" id="engf" ${LPs.engFirst?"checked":""}></label></div>
    <p class="muted" style="font-size:13px;margin:0">On iPhone, if you hear nothing, check the silent switch.</p></div>`;
  updateListenUI();
  const back=P.back,cat=P.cat,from=P.from;
  bindBack(()=>{stopListen();P=back==="topic"?{mode:"topic",cat,from}:{mode:"menu"};render()});
  $("#lpplay").onclick=()=>{LPs.on?stopListen():startListen()};
  const jump=d=>{const was=LPs.on;stopListen();P.i=(P.i+d+P.list.length)%P.list.length;LPs.step=0;updateListenUI();if(was)startListen();else playWord(P.list[P.i],S.lang)};
  $("#lpprev").onclick=()=>jump(-1);$("#lpnext").onclick=()=>jump(1);
  $("#engf").onchange=e=>{LPs.engFirst=e.target.checked};
}

    else body=`${q.t==="listen"?`<div class="row" style="justify-content:center"><button class="play" id="say">${ICON.spk}</button><span class="muted">What does it mean?</span></div>`:`<div class="prompt" style="text-align:center">How do you say “${esc(q.c.en)}”?</div>`}
      <div class="opts">${q.opts.map((o,i)=>{let cls="";if(AG.reveal){if(o===q.c)cls="right";else if(i===AG.pick)cls="wrong";else cls="dim"}return `<button class="opt ${cls}" data-o="${i}" ${AG.locked?"disabled":""}>${q.t==="listen"?esc(o.en):`<span lang="${lang}">${esc(wt(o,lang))}</span>`}</button>`}).join("")}</div>`;
    html=gameHead(`<span class="hearts">${ICON.heart}${AG.hearts}</span>`)+`<div class="lbody" style="gap:10px;padding-bottom:20px"><div class="bossbox"><div class="bname">${esc(B.name)}</div>${face}<div class="hp"><i style="width:${pct}%"></i></div><span class="mono muted" style="font-size:12px">${B.hp} / ${B.max} HP</span></div>${body}</div>`;
    after=()=>{

      m.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(AG.locked)return;const i=+b.dataset.o;AG.pick=i;
        if(q.opts[i]===q.c){gameRight();AG.locked=true;playWord(q.c,lang,{quiet:true});bossHit((q.t==="listen"?15:12)+Math.min(10,AG.combo*2));vGame(m)}else{gameWrong()}});
      m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="⌫")AG.val=AG.val.slice(0,-1);else AG.val+=k;sfx("tick");$("#tbox").innerHTML=esc(AG.val)+'<i class="caret"></i>';$("#atk").disabled=!AG.val.trim()});
      const atk=$("#atk");if(atk)atk.onclick=()=>{const r=judge(AG.val,q.c,lang);gameRecall(q.c,r.ok);if(r.ok){gameRight();AG.locked=true;playWord(q.c,lang,{quiet:true});bossHit(25+Math.min(10,AG.combo*2));vGame(m)}else gameWrong()};
    };
  } else if(AG.id==="slovo"){
    const s=AG.sl,n=s.w.length;
    const rows=[];for(let r=0;r<6;r++){const g=s.rows[r];const cells=[];for(let i=0;i<n;i++){if(g)cells.push(`<span class="sq ${g.res[i]}">${esc(g.w[i])}</span>`);else if(r===s.rows.length&&!s.done)cells.push(`<span class="sq ${s.cur[i]?"typed":""}">${esc(s.cur[i]||"")}</span>`);else cells.push(`<span class="sq"></span>`)}rows.push(`<div class="sqrow" style="grid-template-columns:repeat(${n},1fr)">${cells.join("")}</div>`)}
    html=gameHead(`<span class="pill">Round ${AG.round+1}</span>`)+`<div class="lbody" style="gap:10px;padding-bottom:0"><div class="slgrid" lang="${lang}" style="max-width:${n*56}px">${rows.join("")}</div>
      ${s.done?`<div class="fb ${s.won?"good":"bad"}">${s.won?"Got it!":"The word was:"} <b lang="${lang}">${esc(s.w)}</b> = ${esc(s.c.en)}</div><div class="two-btn"><button class="btn" id="slsay">${ICON.play} Hear it</button>${s.won?`<button class="btn pri" id="slnext">Next word</button>`:`<button class="btn pri" id="slend">See score</button>`}</div>`
        :`<div class="row" style="justify-content:center"><span class="muted" style="font-size:13px">${n} letters</span>${s.hint?`<span class="pill">${esc(s.c.en)}</span>`:`<button class="chip" id="slhint">Show the meaning (−1)</button>`}</div>`}</div>
      ${s.done?"":kbHTML(lang,{states:s.keys,noSpace:true,enter:"Enter"})}`;
    after=()=>{
      m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="⌫")s.cur=s.cur.slice(0,-1);else if(k==="⏎"){if([...s.cur].length!==n){toast(`Needs ${n} letters`);return}const res=slovoEval([...s.cur],[...s.w]);s.rows.push({w:[...s.cur],res});[...s.cur].forEach((ch,i)=>{const o=s.keys[ch];if(res[i]==="hit"||(res[i]==="near"&&o!=="hit")||!o)s.keys[ch]=res[i]});
        if(s.cur===s.w){s.done=true;s.won=true;const pts=Math.max(1,7-s.rows.length-(s.hint?1:0));gameRight();AG.score+=pts-1;gameRecall(s.c,true);playWord(s.c,lang,{quiet:true});floatText("+"+pts)}else if(s.rows.length>=6){s.done=true;sfx("bad");gameRecall(s.c,false);playWord(s.c,lang,{quiet:true})}else sfx("pop");s.cur=""}
        else if([...s.cur].length<n){s.cur+=k;sfx("tick")}vGame(m)});
      const h=$("#slhint");if(h)h.onclick=()=>{s.hint=true;vGame(m)};
      const sy=$("#slsay");if(sy)sy.onclick=()=>playWord(s.c,lang);
      const nx=$("#slnext");if(nx)nx.onclick=()=>{AG.round++;newSlovo();vGame(m)};
      const en=$("#slend");if(en)en.onclick=()=>{AG.endWord=s.c;AG.reveal=true;endGame()};
    };
  } else if(AG.id==="flip"){
    html=gameHead(`<span class="pill">${AG.moves} moves</span>`)+`<div class="lbody"><div class="flipgrid">${AG.cards.map(x=>`<button class="fc ${x.up||x.done?"up":""} ${x.done?"done":""}" data-fc="${x.i}">${x.up||x.done?(x.side==="t"?`<span lang="${lang}">${esc(wt(x.c,lang))}</span>`:esc(x.c.en)):`<span class="q">?</span>`}</button>`).join("")}</div><p class="muted" style="text-align:center;font-size:13px;margin:0">Pair each word with its meaning. Score = 40 minus moves.</p></div>`;
    after=()=>m.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{if(AG.busy)return;const x=AG.cards[+b.dataset.fc];if(x.up||x.done)return;x.up=true;AG.open.push(x);if(x.side==="t")playWord(x.c,lang,{quiet:true});else sfx("pop");
      if(AG.open.length===2){AG.moves++;const [a,b2]=AG.open;if(a.c===b2.c){a.done=b2.done=true;AG.open=[];AG.found++;gameRight();AG.score=Math.max(0,40-AG.moves);if(AG.found===6){AG.score=Math.max(1,40-AG.moves);setTimeout(endGame,500)}}
        else{AG.busy=true;AG.combo=0;setTimeout(()=>{if(!AG||AG.id!=="flip")return;a.up=b2.up=false;AG.open=[];AG.busy=false;!AG.over&&vGame(m)},850)}}
      AG.score=Math.max(0,40-AG.moves);vGame(m)});
  } else if(AG.id==="hang"){
    const h=AG.h,shown=[...h.w].map(ch=>h.guessed.includes(ch)||h.done?ch:"_");
    const parts=["M10 108h60","M25 108V10","M25 10h50","M75 10v14","circle","M75 46v28","M75 54l-14 10M75 54l14 10","M75 74l-12 18M75 74l12 18"];
    const draw=parts.slice(0,Math.min(parts.length,h.wrong+1)).map(p=>p==="circle"?`<circle cx="75" cy="35" r="11" fill="none" stroke="currentColor" stroke-width="4"/>`:`<path d="${p}" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>`).join("");
    const states={};h.guessed.forEach(ch=>states[ch]=h.w.includes(ch)?"hit":"miss");
    html=gameHead(`<span class="pill">${7-h.wrong} left</span>`)+`<div class="lbody" style="gap:10px;padding-bottom:0"><svg viewBox="0 0 110 115" class="gallows">${draw}</svg>
      <div class="prompt" style="text-align:center">“${esc(h.c.en)}”</div><div class="hword" lang="${lang}">${shown.map(c=>`<span>${esc(c)}</span>`).join("")}</div>
      ${h.done?`<div class="fb ${h.won?"good":"bad"}">${h.won?"Saved!":"Hanged."} <b lang="${lang}">${esc(h.w)}</b>${h.c[lang].tr?` <span class="mono">(${esc(h.c[lang].tr)})</span>`:""}</div><div class="two-btn"><button class="btn" id="hsay">${ICON.play} Hear it</button>${h.won?`<button class="btn pri" id="hnext">Next word</button>`:`<button class="btn pri" id="hend">See score</button>`}</div>`
        :`<div class="row" style="justify-content:center"><button class="chip" id="haud">Hear it (costs a life)</button></div>`}</div>${h.done?"":kbHTML(lang,{states,noSpace:true})}`;
    after=()=>{
      m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="⌫"||h.guessed.includes(k))return;h.guessed.push(k);
        if(h.w.includes(k)){sfx("pop");if([...h.w].every(ch=>h.guessed.includes(ch))){h.done=true;h.won=true;gameRight();gameRecall(h.c,true);playWord(h.c,lang,{quiet:true})}}
        else{h.wrong++;sfx("bad");buzz(30);if(h.wrong>=7){h.done=true;gameRecall(h.c,false);playWord(h.c,lang,{quiet:true})}}vGame(m)});
      const a=$("#haud");if(a)a.onclick=()=>{h.wrong++;playWord(h.c,lang);if(h.wrong>=7)h.done=true;vGame(m)};
      const s2=$("#hsay");if(s2)s2.onclick=()=>playWord(h.c,lang);
      const nx=$("#hnext");if(nx)nx.onclick=()=>{newHang();vGame(m)};
      const en=$("#hend");if(en)en.onclick=()=>{AG.endWord=h.c;AG.reveal=true;endGame()};
    };
  } else if(AG.id==="search"){
    const W=AG.ws;
    const cells=[];for(let r=0;r<W.N;r++)for(let c=0;c<W.N;c++){const k=r+","+c;cells.push(`<button class="wc ${W.hl[k]?"found":""} ${W.sel&&W.sel[0]===r&&W.sel[1]===c?"sel":""}" data-rc="${k}">${esc(W.grid[r][c])}</button>`)}
    html=gameHead(`<span class="pill" id="gtime">0s</span>`)+`<div class="lbody" style="gap:10px"><div class="wgrid" lang="${lang}" style="grid-template-columns:repeat(${W.N},1fr)">${cells.join("")}</div>
      <p class="muted" style="font-size:13px;margin:0;text-align:center">Tap the first letter, then the last. Words run right, down or diagonally.</p>
      <div class="clues">${W.placed.map(p=>`<span class="clue ${p.found?"got":""}">${p.found?`<b lang="${lang}">${esc(p.w)}</b> · `:""}${esc(p.c.en.replace(/\s*\(.*?\)/g,""))}</span>`).join("")}</div></div>`;
    after=()=>m.querySelectorAll("[data-rc]").forEach(b=>b.onclick=()=>{const [r,c]=b.dataset.rc.split(",").map(Number);
      if(!W.sel){W.sel=[r,c];sfx("pop");vGame(m);return}
      const [r0,c0]=W.sel;W.sel=null;
      const hit=W.placed.find(p=>!p.found&&p.r0===r0&&p.c0===c0&&p.r0+p.dr*(p.w.length-1)===r&&p.c0+p.dc*(p.w.length-1)===c);
      if(hit){hit.found=true;for(let k=0;k<hit.w.length;k++)W.hl[(hit.r0+hit.dr*k)+","+(hit.c0+hit.dc*k)]=1;gameRight();playWord(hit.c,lang,{quiet:true});
        if(W.placed.every(p=>p.found)){AG.score=Math.max(10,130-Math.floor((Date.now()-AG.start)/1000));setTimeout(endGame,600)}}
      else{sfx("bad")}vGame(m)});
  }
  m.innerHTML=`<div class="lsn ${["rain","race"].includes(AG.id)?"gamekb":""}" style="--lc:var(${g.c})">${html}</div>`;
  $("#quit").onclick=quit;
  if(after)after();
  gameTick();
}

/* ================= Letters ================= */
let LV="alpha", quizA=null, decode=null, game=null;
function mastery(lang,u){const r=S.letters[lang+"_"+u];return r?r.r-r.w:0}
function sayLetter(lw){play(S.lang,"L"+lw,{text:lw})}
function newQuizA(){
  const a=ALPHA[S.lang];const weights=a.map(x=>Math.max(1,6-mastery(S.lang,x[0])));
  let pick=Math.random()*weights.reduce((p,c)=>p+c,0),i=0;for(;i<a.length;i++){pick-=weights[i];if(pick<=0)break}
  const L0=a[Math.min(i,a.length-1)];
  quizA={l:L0,opts:shuffle([L0,...shuffle(a.filter(x=>x[2]!==L0[2])).slice(0,3)]),answered:null,lang:S.lang};
}
function newDecode(){const pool=CONCEPTS.filter(c=>c[S.lang].t.length<=12&&!/[.…?!]/.test(c[S.lang].t));decode={c:rnd(pool),shown:false,val:"",lang:S.lang}}
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"").replace(/j/g,"y").replace(/ii/g,"i").replace(/yy/g,"y");
function vLetters(m){
  const l=L();
  if(!l.cyr){
    const rows=SOUNDS[S.lang].map((r,i)=>`<button class="wrow" data-s="${i}"><span class="txt"><span class="w" style="font-size:18px">${esc(r[0])}</span><span class="en">${esc(r[1])}</span><span class="tr" lang="${S.lang}">${esc(r[2])}</span></span><span class="ic">${ICON.spk}</span></button>`).join("");
    m.innerHTML=`<div class="stack"><div><span class="eyebrow">${esc(l.name)}</span><h2>Sounds to watch</h2><p class="lede">Same alphabet as English, different sounds. Tap a row to hear the example.</p></div><div class="wlist">${rows}</div><p class="muted" style="font-size:14px">The Cyrillic alphabet trainer is under Українська and Русский.</p></div>`;
    m.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>play(S.lang,"S"+b.dataset.s,{text:SOUNDS[S.lang][+b.dataset.s][2]}));
    return;
  }
  m.innerHTML=`<div class="stack"><div class="seg" role="group"><button data-lv="alpha" aria-pressed="${LV==="alpha"}">Alphabet</button><button data-lv="contrast" aria-pressed="${LV==="contrast"}">Ukrainian vs Russian</button></div><div id="lvb" class="stack"></div></div>`;
  m.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{LV=b.dataset.lv;render()});
  (LV==="alpha"?vAlpha:vContrast)($("#lvb"));
}
function vAlpha(m){
  const l=L(),a=ALPHA[S.lang],lang=S.lang;
  if(!quizA||quizA.lang!==lang)newQuizA();
  if(!decode||decode.lang!==lang)newDecode();
  const known=a.filter(x=>mastery(lang,x[0])>=3).length;
  const grid=a.map(x=>{const ex=(LNAME[lang]||{})[x[1]];return `<button class="lt c-${x[4]}" data-ltr="${x[1]}" aria-label="Hear ${x[0]}"><span class="m ${mastery(lang,x[0])>=3?"on":""}"></span><b lang="${lang}">${x[0]}${x[1]}</b><span class="t">${esc(x[2])}</span>${ex?`<span class="x" lang="${lang}">${esc(ex[1])}</span>`:""}</button>`}).join("");
  const q=quizA,ans=q.answered,lab=x=>x[2]==="ʼ"?"soft sign":x[2]==='"'?"hard sign":x[2];
  const opts=q.opts.map((o,i)=>{let cls="";if(ans!==null){if(o===q.l)cls="right";else if(i===ans)cls="wrong"}return`<button class="opt ${cls}" data-o="${i}" ${ans!==null?"disabled":""}>${esc(lab(o))}</button>`}).join("");
  const d=decode,tg=d.c[lang],ok=d.shown&&norm(d.val)===norm(tg.tr);
  m.innerHTML=`<div><span class="eyebrow">${esc(l.name)} · Cyrillic</span><h2>The alphabet</h2><p class="lede">Tap a letter to hear it with an example word. Mastered: ${known} of ${a.length}.</p><div class="bar" style="margin-top:8px"><i style="width:${Math.round(known/a.length*100)}%"></i></div></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Same as English</span><span><i style="background:var(--bad)"></i>Looks familiar, sounds different</span><span><i style="background:var(--uk)"></i>New shape</span></div>
    <div class="letters">${grid}</div>
    <button class="mcard" id="toRush" style="--c:var(--fr)"><span class="ico">${MI.rush}</span><span class="txt"><b>Letter rush</b><span>45-second speed round in the Arcade</span></span><span class="side">${S.best[bestKey("rush",lang)]!=null?`<b>${S.best[bestKey("rush",lang)]}</b>best`:"play"}</span></button>
    <div class="panel stack"><h3>Which sound?</h3><div class="glyphbig" lang="${lang}">${q.l[0]}${q.l[1]}</div><div class="qopts">${opts}</div>
      ${ans!==null?`<div class="fb ${q.opts[ans]===q.l?"good":"bad"}"><b>${q.l[0]} = ${esc(lab(q.l))}</b>: ${esc(q.l[3])}.</div><div class="two-btn"><button class="btn" id="sayq">${ICON.play} Hear it</button><button class="btn pri" id="nextq">Next letter</button></div>`:""}</div>
    <div class="panel stack"><h3>Read a real word</h3><p class="muted" style="margin:0;font-size:14px">Sound it out, then type it in Latin letters. +3 XP when right.</p>
      <div class="which" lang="${lang}">${esc(lang==="uk"&&S.stress?(UKS[tg.t]||tg.t):tg.t)}</div>
      <input type="text" id="dec" placeholder="e.g. kava" value="${esc(d.val)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      ${d.shown?`<div class="fb ${ok?"good":"bad"}">${ok?"Spot on.":"Here's how it reads:"} <b class="mono">${esc(tg.tr)}</b> means “${esc(d.c.en)}”.</div>`:""}
      <div class="two-btn"><button class="btn" id="sayd">${ICON.play} Listen</button>${d.shown?`<button class="btn pri" id="nextd">Next word</button>`:`<button class="btn pri" id="chk">Check</button>`}</div></div>`;
  $("#toRush").onclick=()=>startGame("rush");
  m.querySelectorAll("[data-ltr]").forEach(b=>b.onclick=()=>{m.querySelectorAll(".lt.playing").forEach(x=>x.classList.remove("playing"));b.classList.add("playing");sayLetter(b.dataset.ltr)});
  m.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.o;quizA.answered=i;const k=lang+"_"+quizA.l[0];const r=S.letters[k]||{r:0,w:0};
    if(quizA.opts[i]===quizA.l){r.r++;sfx("ok");S.letters[k]=r;addXP(1);floatText("+1 XP")}else{r.w++;sfx("bad");S.letters[k]=r;save()}
    vAlpha(m);sayLetter(quizA.l[1])});
  const nq=$("#nextq");if(nq)nq.onclick=()=>{newQuizA();vAlpha(m)};
  const sq=$("#sayq");if(sq)sq.onclick=()=>sayLetter(quizA.l[1]);
  const inp=$("#dec");inp.oninput=()=>decode.val=inp.value;inp.onkeydown=e=>{if(e.key==="Enter")(decode.shown?$("#nextd"):$("#chk")).click()};
  const chk=$("#chk");if(chk)chk.onclick=()=>{decode.shown=true;const good=norm(decode.val)===norm(tg.tr);if(good){sfx("ok");addXP(3);floatText("+3 XP")}else sfx("bad");vAlpha(m);playWord(decode.c,lang)};
  const nd=$("#nextd");if(nd)nd.onclick=()=>{newDecode();vAlpha(m)};
  $("#sayd").onclick=()=>playWord(decode.c,lang);
}
const UKONLY=/[ґєії]/i,RUONLY=/[ёъыэ]/i;
const DIFF=CONCEPTS.filter(c=>c.uk.t!==c.ru.t);
function newRound(){const c=rnd(DIFF);game=Object.assign(game||{score:0,total:0},{c,lang:Math.random()<.5?"uk":"ru",pick:null})}
function clue(c,lang){const t=c[lang].t,o=lang==="uk"?"ru":"uk";const m1=t.match(lang==="uk"?UKONLY:RUONLY);if(m1)return`The letter ${m1[0]} only exists in ${LANGS[lang].name}.`;return`No giveaway letter, so it's vocabulary: ${LANGS[o].name} says ${c[o].t} (${c[o].tr}).`}
function vContrast(m){
  loadAudio("uk");loadAudio("ru");
  if(!game)newRound();
  const g=game,done=g.pick!==null,right=done&&g.pick===g.lang;
  const rows=DIFF.map(c=>`<tr><td>${esc(c.en)}</td><td class="ukc"><button class="back" style="color:inherit;padding:0;min-height:0;text-align:left" data-pp="uk|${c.id}"><b lang="uk">${esc(wt(c,"uk"))}</b></button><small>${esc(c.uk.tr)}</small></td><td class="ruc"><button class="back" style="color:inherit;padding:0;min-height:0;text-align:left" data-pp="ru|${c.id}"><b lang="ru">${esc(c.ru.t)}</b></button><small>${esc(c.ru.tr)}</small></td></tr>`).join("");
  m.innerHTML=`<div><span class="eyebrow">Learning both at once</span><h2>Ukrainian vs Russian</h2><p class="lede">Same alphabet, lots of shared grammar, plenty of chances to mix them up.</p></div>
    <div class="panel stack"><div class="row" style="justify-content:space-between"><h3>Which language is this?</h3><span class="pill">${g.score} / ${g.total}</span></div>
      <div class="which">${esc(g.c[g.lang].t)}</div>
