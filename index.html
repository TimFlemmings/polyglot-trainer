let drill=null, samplePromise=null;
function getSample(){if(!samplePromise)samplePromise=(window.claude&&window.claude.use?claude.use("sample"):Promise.resolve(null)).catch(()=>null);return samplePromise}
function vDrills(m){
  if(drill)return vDrill(m);
  const mine=DRILLS.filter(d=>d.lang===S.lang),rest=DRILLS.filter(d=>d.lang!==S.lang);
  const card=d=>{const done=S.drills[d.id];return`<button class="dcard" style="--c:${lc(d.lang)}" data-drill="${d.id}"><span class="eyebrow">${LANGS[d.lang].name}${done?` · ${done.score}/${d.practice.length}`:""}</span><b>${esc(d.title)}</b><p>${esc(d.teaser)}</p></button>`};
  m.innerHTML=`<div class="stack">${backBtn("Practice")}<div><h2>Grammar puzzles</h2><p class="lede">See real examples and spot the rule yourself. Write your theory, take hints one at a time, then reveal the rule. +10 XP for the practice round.</p></div>
    ${mine.length?`<h3>${esc(L().name)}</h3><div class="stack" style="gap:8px">${mine.map(card).join("")}</div>`:""}<h3>Other languages</h3><div class="stack" style="gap:8px">${rest.map(card).join("")}</div></div>`;
  bindBack();
  m.querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>{drill={d:DRILLS.find(x=>x.id===b.dataset.drill),hints:0,theory:"",fb:"",busy:false,rule:false,ans:{}};loadAudio(drill.d.lang);render();window.scrollTo(0,0)});
}
function vDrill(m){
  const D=drill.d,lg=D.lang;
  const groups=D.groups.map(([h,rows])=>`<div class="exgroup"><h4>${esc(h)}</h4>${rows.map(r=>`<button class="exrow" data-ex="${esc(r[0])}"><span class="txt"><div class="t" lang="${lg}">${esc(lg==="uk"&&S.stress?(UKS[r[0]]||r[0]):r[0])}</div><div class="e">${r[1]?`<span class="mono">${esc(r[1])}</span> · `:""}${esc(r[2])}</div></span><span class="ic">${ICON.spk}</span></button>`).join("")}</div>`).join("");
  const hints=D.hints.slice(0,drill.hints).map((h,i)=>`<div class="hint"><b>Hint ${i+1}.</b> ${esc(h)}</div>`).join("");
  const prac=drill.rule?`<div class="panel stack"><h3>Try it</h3>${D.practice.map((p,pi)=>{const a=drill.ans[pi];return`<div class="stack" style="gap:8px"><div lang="${lg}"><b>${esc(p[0])}</b></div><div class="opts">${p[1].map((o,oi)=>`<button class="opt ${a!==undefined?(oi===p[2]?"right":oi===a?"wrong":""):""}" data-p="${pi}" data-oi="${oi}" ${a!==undefined?"disabled":""}>${esc(o)}</button>`).join("")}</div>${a!==undefined?`<div class="muted" style="font-size:14px">${esc(p[3])}</div>`:""}</div>`}).join("")}</div>`:"";
  m.innerHTML=`<div class="stack" style="--lc:${lc(lg)}"><div><button class="back" id="dback">‹ All puzzles</button><span class="eyebrow" style="display:block">${LANGS[lg].name}</span><h2>${esc(D.title)}</h2></div>
    <div class="stack" style="gap:8px">${groups}</div><div class="q">${esc(D.question)}</div>
    <div class="panel stack"><label for="theory"><b>Your theory</b> <span class="muted">(write it before peeking)</span></label><textarea id="theory" placeholder="I think…">${esc(drill.theory)}</textarea>
      ${STANDALONE?"":`<button class="btn pri block" id="ask" ${drill.busy?"disabled":""}>${drill.busy?"Tutor is reading…":"Check my reasoning"}</button>`}
      <div class="two-btn"><button class="btn" id="hint" ${drill.hints>=D.hints.length?"disabled":""}>Hint (${D.hints.length-drill.hints} left)</button><button class="btn ghost" id="rule" ${drill.rule?"disabled":""}>Reveal rule</button></div>
      <div class="tutorfb" id="fb" ${drill.fb?"":"hidden"}>${esc(drill.fb)}</div></div>
    ${hints}${drill.rule?`<div class="rule"><b>The rule.</b> ${esc(D.rule)}</div>`:""}${prac}</div>`;
  $("#dback").onclick=()=>{drill=null;render()};
  m.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>play(lg,"T:"+b.dataset.ex,{text:b.dataset.ex}));
  const ta=$("#theory");ta.oninput=()=>drill.theory=ta.value;
  $("#hint").onclick=()=>{drill.hints++;vDrill(m)};
  $("#rule").onclick=()=>{drill.rule=true;vDrill(m)};
  if($("#ask"))$("#ask").onclick=async()=>{
    if(!drill.theory.trim()){toast("Write your theory first, even a rough guess");ta.focus();return}
    const s=await getSample();
    if(!s){drill.fb="The tutor check works when this page is opened in Claude. For now, compare your theory with the hints.";vDrill(m);return}
    drill.busy=true;drill.fb="";vDrill(m);
    const ex=D.groups.map(([h,rows])=>h+": "+rows.map(r=>`${r[0]}${r[1]?" ("+r[1]+")":""} = ${r[2]}`).join("; ")).join("\n");
    const prompt=`You are a Socratic language tutor. A beginner (an adult English speaker who likes to reason things out) is doing a pattern-discovery drill in ${LANGS[lg].name}.\n\nExamples shown:\n${ex}\n\nQuestion asked: ${D.question}\n\nThe correct rule (do NOT state it outright): ${D.rule}\n\nThe learner's theory: """${drill.theory}"""\n\nReply in under 90 words, plain text, no headings. Say specifically what is right in their theory. If anything is missing or wrong, do not give the answer: point them at one example to look at again and ask one guiding question. If the theory is fully correct, confirm it warmly and add one small extension or exception to notice.`;
    try{const r=await s(prompt,{modelTier:"quick",cache:false,onText:({text})=>{drill.fb=text;const el=document.getElementById("fb");if(el){el.hidden=false;el.textContent=text}}});drill.fb=r.text}
    catch(e){drill.fb=e&&e.code==="not_granted"?"The tutor wasn't allowed to run. You can allow it from this page's permissions.":e&&e.code==="rate_limited"?"The tutor is busy. Try again in a minute.":"The tutor couldn't answer just now. Try again in a moment."}
    drill.busy=false;if(S.tab==="practice"&&drill)vDrill(m);
  };
  m.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    const pi=+b.dataset.p,oi=+b.dataset.oi;drill.ans[pi]=oi;sfx(D.practice[pi][2]===oi?"ok":"bad");
    if(Object.keys(drill.ans).length===D.practice.length){const score=D.practice.filter((p,i)=>drill.ans[i]===p[2]).length;S.drills[D.id]={score,at:Date.now()};addXP(10);floatText("+10 XP")}
    vDrill(m)});
}

/* ================= Tutor ================= */
const chats={};
function chatFor(lang){if(!chats[lang])chats[lang]={scen:"cafe",msgs:[],busy:false,draft:""};return chats[lang]}
function tutorSystem(lang,scen){
  const sc=SCENARIOS.find(s=>s[0]===scen),l=LANGS[lang];
  return`You are a patient, encouraging ${l.name} tutor running a role-play with an adult English speaker who is a beginner and is learning for travel and everyday talk. He prefers a Socratic style: let him try first, give hints before answers, and let him work things out.\n\nRole-play: ${sc[2]}\n\nRules:\n- Keep each reply under 70 words.\n- Speak in very simple ${l.name}: short sentences, travel vocabulary.${l.cyr?"\n- After every "+l.name+" sentence, add the Latin transliteration in square brackets.":""}\n- Then add a short English gloss in italics using *asterisks*.\n- If he makes a mistake, show the corrected version once, briefly say why, and let him try again before moving on.\n- If he writes in English, show him how to say it in ${l.name} and ask him to type it himself.\n- If he says he is stuck, give a hint (first letter, a word bank, or a choice of two), not the full answer.\n- Stay in character. End each reply with something for him to answer.\n- Never use ${lang==="uk"?"Russian":lang==="ru"?"Ukrainian":"another language"} words by mistake.`;
}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
async function tutorSend(text,m){
  const lang=S.lang,ch=chatFor(lang);const s=await getSample();
  if(!s){toast("The tutor works when this page is opened in Claude");return}
  if(text)ch.msgs.push({role:"user",content:text});
  ch.busy=true;ch.msgs.push({role:"assistant",content:""});vTutor(m);
  const input=[{role:"user",content:tutorSystem(lang,ch.scen)+"\n\nStart the role-play now with your first line."},...ch.msgs.slice(0,-1)];
  if(input.length>1&&input[1].role==="user")input.splice(1,0,{role:"assistant",content:"(ready)"});
  const last=ch.msgs[ch.msgs.length-1];
  try{
    const r=await s(input,{cache:false,onText:({text})=>{last.content=text;const el=document.querySelector(".msg.a:last-child");if(el&&P.mode==="tutor"&&S.lang===lang)el.innerHTML=md(text);const c=document.getElementById("chat");if(c)c.scrollTop=c.scrollHeight}});
    last.content=r.text;
    if(text&&!text.startsWith("(")){S.stats.tutorMsgs++;addXP(3)}
  }catch(e){ch.msgs.pop();if(text)ch.msgs.pop();toast(e&&e.code==="not_granted"?"The tutor wasn't allowed to run":e&&e.code==="rate_limited"?"The tutor is busy. Try again in a minute":"The tutor couldn't answer. Try again")}
  ch.busy=false;if(S.tab==="practice"&&P.mode==="tutor"&&S.lang===lang)vTutor(m);
}
function vTutor(m){
  const lang=S.lang,l=L(),ch=chatFor(lang);
  const scen=SCENARIOS.map(s=>`<button data-scen="${s[0]}" aria-pressed="${s[0]===ch.scen}">${esc(s[1])}</button>`).join("");
  const msgs=ch.msgs.map(x=>`<div class="msg ${x.role==="user"?"u":"a"}" ${x.role==="user"?"":`lang="${lang}"`}>${x.role==="user"?esc(x.content):(x.content?md(x.content):'<span class="muted">…</span>')}</div>`).join("");
  m.innerHTML=`<div class="stack">${backBtn("Practice")}<div><h2>Tutor role-play</h2><p class="lede">The tutor plays the other person, corrects you gently and gives hints, not answers. +3 XP per reply.${l.cyr?" Latin letters are fine at first.":""}</p></div>
    <div class="chips">${scen}</div>
    <div class="panel stack"><div class="chat" id="chat">${msgs||`<div class="muted" style="margin:auto;text-align:center;max-width:36ch">Start the role-play and the tutor will open the conversation.</div>`}</div>
      ${ch.msgs.length?`<div class="composer"><textarea id="say" placeholder="Reply in ${esc(l.name)}…" ${ch.busy?"disabled":""}>${esc(ch.draft)}</textarea><button class="btn pri" id="send" ${ch.busy?"disabled":""}>Send</button></div>
      <div class="chips"><button id="stuck" ${ch.busy?"disabled":""}>I'm stuck, hint please</button><button id="slow" ${ch.busy?"disabled":""}>Explain that line</button><button id="restart" ${ch.busy?"disabled":""}>Restart</button></div>`:`<button class="btn pri block" id="start">Start the role-play</button>`}</div></div>`;
  bindBack();
  const c=$("#chat");c.scrollTop=c.scrollHeight;
  m.querySelectorAll("[data-scen]").forEach(b=>b.onclick=()=>{if(ch.busy)return;ch.scen=b.dataset.scen;ch.msgs=[];vTutor(m)});
  const st=$("#start");if(st)st.onclick=()=>tutorSend(null,m);
  const ta=$("#say");
  if(ta){ta.oninput=()=>ch.draft=ta.value;ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!("ontouchstart" in window)){e.preventDefault();$("#send").click()}};
    $("#send").onclick=()=>{const t=ch.draft.trim();if(!t)return;ch.draft="";tutorSend(t,m)};
    $("#stuck").onclick=()=>tutorSend("(I'm stuck. Give me a hint, not the full answer.)",m);
    $("#slow").onclick=()=>tutorSend("(Please break down your last line word by word in English, then repeat your question.)",m);
    $("#restart").onclick=()=>{ch.msgs=[];vTutor(m)};}
}

    <div class="panel stack"><div class="row" style="justify-content:space-between"><h3>This week</h3><span class="muted" style="font-size:13px">gold = goal hit</span></div><div class="week">${week}</div></div>
    <div class="panel stack"><h3>Languages</h3>${ORDER.map(l=>{const done=totalCrowns(l),max=CATS.length*MAXC;return `<div class="langrow" style="--lc:var(--${l})"><span style="font-weight:700">${LANGS[l].name}</span><div class="bar"><i style="width:${Math.round(done/max*100)}%"></i></div><span class="mono muted" style="font-size:12px">${done}/${max}</span></div>`}).join("")}<p class="muted" style="font-size:12px;margin:0">Crowns earned in each tree.</p></div>
    <div><h3 style="margin-bottom:8px">Badges</h3><div class="badges">${BADGES.map(b=>`<div class="bdg ${S.badges[b[0]]?"got":""}"><span class="md">${ICON[b[3]].replace("<svg",'<svg fill="currentColor"')}</span><b>${esc(b[1])}</b><span>${esc(b[2])}</span></div>`).join("")}</div></div>
    <div class="panel stack"><h3>Move your progress</h3><p class="muted" style="margin:0;font-size:14px">Carry crowns, XP, streak and words between the online version and the offline phone app.</p>
      <div class="two-btn"><button class="btn" id="tout">Copy my code</button><button class="btn" id="tin">Paste a code</button></div>
      ${installEvt?`<button class="btn pri block" id="inst">Install on this phone</button>`:""}</div>
    <div class="panel stack" style="gap:2px"><h3 style="margin-bottom:6px">Settings</h3>
      <div class="toggle"><span>Daily XP goal</span><div class="seg" style="width:auto">${[20,30,50,100].map(n=>`<button data-goal="${n}" aria-pressed="${S.goal===n}" style="padding:6px 10px;min-height:36px">${n}</button>`).join("")}</div></div>
      <label class="toggle"><span>Sound effects</span><input type="checkbox" id="sx" ${S.sfx?"checked":""}></label>
      <label class="toggle"><span>Play word audio automatically in review</span><input type="checkbox" id="ap" ${S.autoplay?"checked":""}></label>
      <label class="toggle"><span>In-app Cyrillic keyboard for typing</span><input type="checkbox" id="osk" ${S.osk?"checked":""}></label>
      <label class="toggle"><span>Show transliteration (kava)</span><input type="checkbox" id="tr" ${S.showTr?"checked":""}></label>
      <label class="toggle"><span>Ukrainian stress marks (до́брий)</span><input type="checkbox" id="sm" ${S.stress?"checked":""}></label>
      <div class="toggle"><span>New review words per day</span><div class="seg" style="width:auto">${[5,10,20].map(n=>`<button data-npd="${n}" aria-pressed="${S.newPerDay===n}" style="padding:6px 10px;min-height:36px">${n}</button>`).join("")}</div></div>
      <p class="muted" style="font-size:12px;margin:8px 0 0">${esc(SYNC)}</p>
    </div></div>`;
  m.querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;save();render()});
  m.querySelectorAll("[data-npd]").forEach(b=>b.onclick=()=>{S.newPerDay=+b.dataset.npd;save();render()});
  $("#sx").onchange=e=>{S.sfx=e.target.checked;save();if(S.sfx)sfx("ok")};
  $("#tout").onclick=()=>transferSheet("out");$("#tin").onclick=()=>transferSheet("in");
  const ins=$("#inst");if(ins)ins.onclick=async()=>{try{installEvt.prompt();await installEvt.userChoice}catch(e){}installEvt=null;render()};
  $("#ap").onchange=e=>{S.autoplay=e.target.checked;save()};
  $("#tr").onchange=e=>{S.showTr=e.target.checked;save()};
  $("#osk").onchange=e=>{S.osk=e.target.checked;save()};
  $("#sm").onchange=e=>{S.stress=e.target.checked;save()};
}

document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(LS){
    const e2=LS.q[LS.i];
    if((e.key==="Enter"||e.code==="Space")&&$("#cont")){e.preventDefault();$("#cont").click();return}
    if(e2&&e2.opts&&!LS.answered&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`[data-o="${+e.key-1}"]`);if(b)b.click()}
    return;
  }
  if(S.tab==="practice"&&P.mode==="review"&&cur){
    if(e.code==="Space"&&!revealed){e.preventDefault();$("#reveal")&&$("#reveal").click()}
    else if(revealed&&/^[1-4]$/.test(e.key))grade(+e.key);
  }
});
migrateSkills();checkBadges();AWARDQ.length=0;
preload();render();

</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
</script>
</body>
</html>
